[package]
name = "meet"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Talk to your repo: a live meeting transcript becomes action items, action items become Claude Code agents in git worktrees, agents become pull requests."

[[bin]]
name = "meet"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
futures = "0.3"
libc = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "all-widgets"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "sync", "time", "macros", "io-util", "fs"] }
ulid = { version = "3", features = ["std"] }

[dev-dependencies]
tempfile = "3"
